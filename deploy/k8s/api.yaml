apiVersion: apps/v1
kind: Deployment
metadata:
  name: poc-api
  namespace: outbox-poc
  labels:
    app: poc-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poc-api
  template:
    metadata:
      labels:
        app: poc-api
    spec:
      containers:
        - name: api
          image: poc-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: outbox-poc-config
          # GET /health retorna 200; Swagger habilitado em todos os ambientes nesta POC
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: poc-api
  namespace: outbox-poc
spec:
  selector:
    app: poc-api
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: poc-api-ingress
  namespace: outbox-poc
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: poc-api
                port:
                  number: 80
