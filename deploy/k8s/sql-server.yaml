apiVersion: apps/v1
kind: Deployment
metadata:
  name: sql-server
  namespace: outbox-poc
  labels:
    app: sql-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sql-server
  template:
    metadata:
      labels:
        app: sql-server
    spec:
      containers:
        - name: sql-server
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sql-server-secret
                  key: sa-password
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
          volumeMounts:
            - name: mssql-conf
              mountPath: /var/opt/mssql/mssql.conf
              subPath: mssql.conf
          # SQL Server no container demora para abrir a porta; delay alto evita restart precoce
          livenessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 120
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 1433
            initialDelaySeconds: 90
            periodSeconds: 10
      volumes:
        - name: mssql-conf
          configMap:
            name: sql-server-mssql-conf
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sql-server-mssql-conf
  namespace: outbox-poc
data:
  mssql.conf: |
    [network]
    tcpiplistener = 0.0.0.0
    port = 1433
---
apiVersion: v1
kind: Service
metadata:
  name: sql-server
  namespace: outbox-poc
spec:
  selector:
    app: sql-server
  ports:
    - port: 1433
      targetPort: 1433
  type: ClusterIP
---
apiVersion: v1
kind: Secret
metadata:
  name: sql-server-secret
  namespace: outbox-poc
type: Opaque
stringData:
  sa-password: "YourStrong!Passw0rd"
